# pnpm 11 以降、各種設定は package.json の "pnpm" フィールドではなくここで読まれる。

# esbuild: vite が 0.27.7 をピンするが GHSA-gv7w-rqvm-qjhr (high) 回避のため 0.28.1+ を強制。
# vite: GHSA-fx2h-pf6j-xcff (server.fs.deny バイパス, high) 回避のため 7.3.5+ を強制。
overrides:
  esbuild@<0.28.1: '>=0.28.1'
  vite@<7.3.5: '>=7.3.5'

# 依存の postinstall ビルドスクリプトは既定でブロック。実行を許可する物だけ true で明示。
# 両者とも未許可でも build/test は通る (esbuild は platform 専用 optional dep がバイナリを提供、
# @parcel/watcher は dev 時のファイル監視のみ)。
allowBuilds:
  esbuild: false
  '@parcel/watcher': false
