# fly.toml — Fly.io デプロイ設定
# 初回: fly launch --no-deploy でアプリを登録してから fly deploy
# シークレット設定 (fly secrets set KEY=VALUE):
#   DB_HOST / DB_PORT / DB_NAME / DB_APP_USER / DB_APP_PASSWORD / DB_SSLMODE
#   JWT_SECRET / SIGNED_URL_SECRET / LICENSE_SECRET / ADM_LIC_ENC_KEY
#   STORAGE_BACKEND / S3_BUCKET / S3_ENDPOINT_URL / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
#   CORS_ORIGINS

app = "adm-pathfinder-api"  # ← fly launch 後に発行された名前に変更
primary_region = "nrt"       # 東京リージョン

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
    success_codes = [200]

[deploy]
  # デプロイ前に新コンテナで migration を実行し、完了後に旧コンテナを切り替える
  release_command = "alembic upgrade head"

[vm]
  size = "shared-cpu-1x"
  memory = "512mb"
